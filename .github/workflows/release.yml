name: release

# Changesets release flow (the "approve" flow):
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Approving + merging that PR (which removes the changesets) makes this
#      workflow run `release:ci`, which builds every package and then runs
#      `changeset publish`, publishing the changed packages to npm.
#
# Published packages (each sets `publishConfig.access: public` in its own
# package.json): `wherever-dev` (server), `@wherever-dev/client`,
# `@wherever-dev/pi` (extension). `web` and `site` are `private` and never
# publish. `wherever-vscode` is not private; it only publishes if a changeset
# bumps it (none do today).
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) once you register it as a trusted publisher in
# each package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22, and a recent pnpm; publishes are stamped with provenance.
# NOTE: npm ties a trusted publisher to an existing package, so trusted
# publishing can only be registered after a package's first publish. All three
# packages are already on npm, so this tokenless OIDC flow works once each
# package registers this repo + workflow as a trusted publisher.
on:
  push:
    branches: [main]

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe, and the run for the latest
# `main` state always publishes the current version. Without
# `cancel-in-progress: false` a fast feature-push + Version-PR-merge could cancel
# the publish run and leave the bumped version unpublished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance
  actions: write # delete the Version Packages PR's held runs (below)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # release:ci builds every package + format-checks, then runs
          # `changeset publish` (the action itself handles git commits/tags, so
          # no git push here). No NPM_TOKEN: npm detects the OIDC environment and
          # authenticates via the registered trusted publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Version Packages PR is opened and updated with GITHUB_TOKEN, so
      # GitHub creates its `pull_request` runs (test, Nix) in an
      # approval-required state: they never start, and when the PR is merged
      # unapproved they end as "failure", a red cross on every release PR
      # (#114, #116, #117). That PR only bumps versions and changelogs, and the
      # merged commit is tested on main by the push runs, so those held runs are
      # deleted instead of approved. They appear a few seconds after the PR
      # event, hence the short poll. Never fails the release.
      - name: Delete the Version Packages PR's held runs
        if: steps.changesets.outputs.pullRequestNumber != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          seen_head=0
          for _ in $(seq 1 12); do
            # A held run reads `completed` / `action_required` (older ones: status `action_required`).
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&event=pull_request&per_page=50" \
              -q '.workflow_runs[] | select(.status == "action_required" or .conclusion == "action_required") | "\(.id) \(.head_sha) \(.name)"' || true)
            while read -r id sha name; do
              [ -n "$id" ] || continue
              echo "deleting held run $id ($name, ${sha:0:7})"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
              if [ "$sha" = "$head" ]; then seen_head=1; fi
            done <<< "$runs"
            # The head's runs are created together: one more pass after seeing them, then stop.
            if [ "$seen_head" = 1 ] && [ -z "$runs" ]; then break; fi
            sleep 10
          done
