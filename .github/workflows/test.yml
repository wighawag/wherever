name: test

# Runs the server + web unit/integration suites on every push and PR.
#
# Added because nothing ran them: `release.yml` only builds and publishes, and
# `nix.yml` only exercises the Nix packaging. The server suite is the acceptance
# evidence for behaviour that cannot be checked by reading (a read-only config
# directory, a token that never reaches argv, TLS from absolute paths), so it
# needs to run somewhere other than a developer's laptop.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The deployment suite asserts that a directory the running user cannot
      # write is genuinely unwritable, which is false for root. GitHub's
      # ubuntu-latest runner is the non-root `runner` user, so those tests
      # really execute here -- but assert it rather than assuming, because a
      # silent skip would make the most important tests vanish unnoticed.
      - name: Verify the runner is not root (else the read-only tests self-skip)
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "::error::CI is running as root; the read-only config-dir tests would silently skip."
            exit 1
          fi
          id

      - name: Run server tests
        run: pnpm --filter ./server test

  web:
    name: web suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `web` imports `@wherever-dev/client`, whose package main is `dist/`, and
      # `dist/` is gitignored with no `prepare` script to regenerate it. A fresh
      # checkout therefore has no client build, and any web test that reaches
      # the app's top-level module graph (src/lib/wherever.ts) fails to resolve
      # the package. It passes on a developer's machine only because a previous
      # `build:all` left `client/dist` behind.
      - name: Build the client package (web resolves it by its dist entry)
        run: pnpm --filter ./client build

      # web/vitest.config.ts THROWS unless .svelte-kit/tsconfig.json exists (it
      # reads the `$lib` target from there), and /.svelte-kit is gitignored. It
      # is generated by web's `prepare`, so relying on it means relying on pnpm
      # running a workspace project's prepare during install. Run it explicitly
      # for the same reason as the client build above: the job should be
      # self-contained on a clean runner rather than resting on that behaviour.
      - name: Sync SvelteKit (vitest reads the $lib target from its output)
        run: pnpm --filter ./web exec svelte-kit sync

      - name: Run web tests
        run: pnpm --filter ./web test
