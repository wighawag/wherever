name: test

# Runs the server, web and extension unit/integration suites on every push and PR.
#
# Added because nothing ran them: `release.yml` only builds and publishes, and
# `nix.yml` only exercises the Nix packaging. The server suite is the acceptance
# evidence for behaviour that cannot be checked by reading (a read-only config
# directory, a token that never reaches argv, TLS from absolute paths), so it
# needs to run somewhere other than a developer's laptop.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The deployment suite asserts that a directory the running user cannot
      # write is genuinely unwritable, which is false for root. GitHub's
      # ubuntu-latest runner is the non-root `runner` user, so those tests
      # really execute here -- but assert it rather than assuming, because a
      # silent skip would make the most important tests vanish unnoticed.
      - name: Verify the runner is not root (else the read-only tests self-skip)
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "::error::CI is running as root; the read-only config-dir tests would silently skip."
            exit 1
          fi
          id

      - name: Run server tests
        run: pnpm --filter ./server test

  # The server can run on a pi SDK other than the one it bundles (`piSdk` in
  # config.json, see server/src/pi-sdk.ts). TESTED_PI_RANGE in
  # server/src/pi-sdk-policy.ts is the promise that this works without opt-in,
  # so the suite runs on the NEWEST release in that range, installed separately
  # like a user's own pi. (The bottom of the range is the bundled SDK, which the
  # `server` job above already runs on.) pi does not follow semver strictly, so
  # a new patch release can break this job: that is the signal to fix the server
  # or narrow the range, before users meet it.
  # pi-sdk-guard.test.ts fails the job if the install was refused and the suite
  # silently fell back to the bundled SDK. Keep `pi` in sync with TESTED_PI_RANGE.
  server-pi-sdk:
    name: server suite on pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ['~1.4.0']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install pi ${{ matrix.pi }} separately
        run: |
          mkdir -p "$RUNNER_TEMP/pi"
          cd "$RUNNER_TEMP/pi"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
          node -p "'pi ' + require('./node_modules/@earendil-works/pi-coding-agent/package.json').version"

      - name: Run server tests on it
        run: pnpm --filter ./server test
        env:
          WHEREVER_PI_SDK: ${{ runner.temp }}/pi

  web:
    name: web suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `web` imports `@wherever-dev/client`, whose package main is `dist/`, and
      # `dist/` is gitignored with no `prepare` script to regenerate it. A fresh
      # checkout therefore has no client build, and any web test that reaches
      # the app's top-level module graph (src/lib/wherever.ts) fails to resolve
      # the package. It passes on a developer's machine only because a previous
      # `build:all` left `client/dist` behind.
      - name: Build the client package (web resolves it by its dist entry)
        run: pnpm --filter ./client build

      # web/vitest.config.ts THROWS unless .svelte-kit/tsconfig.json exists (it
      # reads the `$lib` target from there), and /.svelte-kit is gitignored. It
      # is generated by web's `prepare`, so relying on it means relying on pnpm
      # running a workspace project's prepare during install. Run it explicitly
      # for the same reason as the client build above: the job should be
      # self-contained on a clean runner rather than resting on that behaviour.
      - name: Sync SvelteKit (vitest reads the $lib target from its output)
        run: pnpm --filter ./web exec svelte-kit sync

      - name: Run web tests
        run: pnpm --filter ./web test

  extension:
    name: extension suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The extension imports `@wherever-dev/client`, whose package main is the
      # gitignored `dist/`: same reason as the web job's client build.
      - name: Build the client package (the extension resolves it by its dist entry)
        run: pnpm --filter ./client build

      - name: Run extension tests
        run: pnpm --filter ./extension test
